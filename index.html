<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>GitHub Profile Detective</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">
    <div class="header">
      <h1 class="title">GitHub Profile Detective</h1>

      <!-- Battle Mode Toggle -->
      <label class="battle-toggle">
        <span class="mode-label">Normal</span>
        <input type="checkbox" id="battleToggle" />
        <span class="slider"></span>
        <span class="mode-label">Battle</span>
      </label>
    </div>

    <!-- NORMAL MODE SEARCH -->
    <div id="normalSearch" class="search-box">
      <input id="searchInput" type="text" placeholder="Search GitHub username" />
      <button id="searchBtn">Search</button>
    </div>

    <!-- BATTLE MODE SEARCH -->
    <div id="battleSearch" class="search-box hidden">
      <input id="userA" type="text" placeholder="Username A" />
      <span class="vs">VS</span>
      <input id="userB" type="text" placeholder="Username B" />
      <button id="battleBtn">Compare</button>
    </div>

    <p id="statusMessage" class="status"></p>

    <!-- Profile Card -->
    <div id="profileCard" class="card hidden">

      <div class="user">
        <img id="avatar" />
        <div>
          <h2 id="name"></h2>
          <p id="username"></p>
        </div>
      </div>

      <div class="repos">
        <h3>Latest Repositories</h3>
        <ul id="repoList"></ul>
      </div>

      <p id="bio" class="bio"></p>

      <!-- Stats -->
      <div class="stats">
        <div>
          <span>Repos</span>
          <strong id="repos"></strong>
        </div>
        <div>
          <span>Followers</span>
          <strong id="followers"></strong>
        </div>
        <div>
          <span>Following</span>
          <strong id="following"></strong>
        </div>
      </div>

      <p id="location" class="location"></p>

      <a id="profileLink" target="_blank" class="btn">
        View Profile
      </a>

    </div>
    <div id="battleArea" class="battle-area hidden">
      <div class="battle-card" id="cardA">
        <img />
        <h3>User A</h3>
        <p class="followers">Followers: —</p>
        <span class="badge hidden">Winner</span>
      </div>

      <div class="battle-card" id="cardB">
        <img />
        <h3>User B</h3>
        <p class="followers">Followers: —</p>
        <span class="badge hidden">Winner</span>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
